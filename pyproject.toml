[project]
name = "ashare-gauntlet"
version = "0.1.0"
description = "Falsification gauntlet for A-share daily cross-sectional stock selection (soilbot-style OOS validation)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
