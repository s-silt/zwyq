[project]
name = "ashare-gauntlet"
version = "0.1.0"
description = "Falsification gauntlet for A-share daily cross-sectional stock selection (soilbot-style OOS validation)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "tushare>=1.4",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# 覆盖率按需跑(不进默认 addopts,避免拖慢日常 pytest):
#   python -m pytest --cov=ashare_gauntlet --cov=scripts --cov-report=term
# 2026-07-11 快照(此后包内已增模块未重测,只作量级参考):核心包 ashare_gauntlet
# 96%(2108 语句漏 81),scripts 编排层拉低 TOTAL 至 55%(多为 CLI/IO 壳,核心
# 逻辑在包内被测)。
[tool.coverage.run]
source = ["ashare_gauntlet", "scripts"]
